name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Tests et qualité du code
  test:
    name: Tests et Qualité
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Pour SonarCloud
    
    - name: Configuration Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Installation des dépendances
      run: npm ci
    
    - name: Vérification du linting
      run: npm run lint || echo "Lint non configuré"
    
    - name: Exécution des tests
      run: npm test
    
    - name: Génération de la couverture de code
      run: npm run test:coverage || npm test
    
    - name: Upload de la couverture vers Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Analyse SonarCloud
      if: false  # Désactivé temporairement - à configurer avec votre organisation SonarCloud
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=recettes-france
          -Dsonar.organization=votre-org
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

  # Job 2: Notification
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [test]  # Ne dépend que des tests
    if: always()
    
    steps:
    - name: Statut du workflow
      run: |
        if [ "${{ needs.test.result }}" == "success" ]; then
          echo "✅ Pipeline réussi - Tests passés"
        else
          echo "❌ Pipeline échoué - Tests échoués"
        fi
