# Configuration Prometheus pour Recettes de France

global:
  scrape_interval: 15s # Intervalle de collecte par défaut
  evaluation_interval: 15s # Intervalle d'évaluation des règles
  external_labels:
    monitor: 'recettes-france-monitor'

# Configuration des alertes (optionnel)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# Chargement des règles d'alerte
rule_files:
  # - "alerts.yml"

# Configuration des cibles à surveiller
scrape_configs:
  # Surveillance de Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Surveillance de l'application Node.js
  - job_name: 'recettes-france-app'
    static_configs:
      - targets: ['app:3000']
        labels:
          service: 'recettes-france'
          environment: 'production'
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Surveillance des métriques système via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'system-metrics'
