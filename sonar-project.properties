# Configuration SonarQube pour le projet Recettes de France

# Informations du projet
sonar.projectKey=recettes-france
sonar.projectName=Recettes de France
sonar.projectVersion=1.0.0

# Chemin des sources
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/tests/**,**/coverage/**,**/public/**,**/*.test.js

# Chemin des tests
sonar.tests=tests
sonar.test.inclusions=**/*.test.js

# Couverture de code
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Langue du projet
sonar.language=js

# Paramètres JavaScript
sonar.javascript.node.maxspace=4096
